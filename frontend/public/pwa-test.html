<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Installation Test</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: 50px auto; 
            padding: 20px; 
            text-align: center; 
        }
        .status { 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 5px; 
        }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        button { 
            padding: 10px 20px; 
            margin: 5px; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            background-color: #4CAF50; 
            color: white; 
        }
    </style>
</head>
<body>
    <h1>PWA Installation Test</h1>
    <div id="status"></div>
    <button onclick="testManifest()">Test Manifest</button>
    <button onclick="testServiceWorker()">Test Service Worker</button>
    <button onclick="testInstall()">Test Install</button>
    
    <script>
        const statusDiv = document.getElementById('status');
        
        function addStatus(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = message;
            statusDiv.appendChild(div);
        }
        
        function testManifest() {
            fetch('/manifest.json')
                .then(response => response.json())
                .then(manifest => {
                    addStatus(`✓ Manifest loaded: ${manifest.name}`, 'success');
                    console.log('Manifest:', manifest);
                })
                .catch(err => {
                    addStatus(`✗ Manifest error: ${err.message}`, 'error');
                    console.error('Manifest error:', err);
                });
        }
        
        function testServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        addStatus('✓ Service Worker registered', 'success');
                        console.log('SW registered:', registration);
                    })
                    .catch(err => {
                        addStatus(`✗ Service Worker error: ${err.message}`, 'error');
                        console.error('SW error:', err);
                    });
            } else {
                addStatus('✗ Service Workers not supported', 'error');
            }
        }
        
        function testInstall() {
            if ('BeforeInstallPromptEvent' in window) {
                addStatus('✓ PWA install prompt supported', 'success');
            } else {
                addStatus('ℹ PWA install prompt not supported (may still be installable)', 'info');
            }
        }
        
        // Listen for beforeinstallprompt
        window.addEventListener('beforeinstallprompt', (e) => {
            addStatus('✓ beforeinstallprompt event fired - app is installable!', 'success');
            console.log('beforeinstallprompt event:', e);
        });
        
        // Auto-run tests
        setTimeout(() => {
            testManifest();
            testServiceWorker();
            testInstall();
        }, 1000);
    </script>
</body>
</html>
